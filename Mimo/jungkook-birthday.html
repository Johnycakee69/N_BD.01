<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday - Animated Jungkook</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#1a0b2e,#4b1e8a,#9d4edd);
    font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden;
  }
  #confetti{position:fixed;inset:0;pointer-events:none}
  .stage{text-align:center;z-index:1}
  h1{
    color:#fff;font-size:2.6rem;letter-spacing:2px;margin-bottom:6px;
    text-shadow:0 4px 20px rgba(0,0,0,.4);
    animation: pop 1.2s ease infinite alternate;
  }
  h1 span{color:#ffe66d}
  @keyframes pop{from{transform:scale(1)}to{transform:scale(1.04)}}
  .subtitle{color:#e0c3fc;margin-bottom:18px;font-size:1.1rem}
  .char-wrap{
    width:420px;max-width:90vw;margin:0 auto;
    animation: bounce 1.6s ease-in-out infinite;
    filter:drop-shadow(0 20px 30px rgba(0,0,0,.4));
  }
  @keyframes bounce{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-18px) rotate(1deg)}}
  .sign-group{transform-origin:200px 300px;animation:wiggle 1.6s ease-in-out infinite}
  @keyframes wiggle{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
  .eye{transform-origin:center;transform-box:fill-box;animation:blink 3.5s infinite}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(0.05)}}
  .arm-left{transform-origin:110px 280px;animation:waveL 1.6s ease-in-out infinite}
  .arm-right{transform-origin:290px 280px;animation:waveR 1.6s ease-in-out infinite}
  @keyframes waveL{0%,100%{transform:rotate(0)}50%{transform:rotate(-8deg)}}
  @keyframes waveR{0%,100%{transform:rotate(0)}50%{transform:rotate(8deg)}}
  .balloon{position:absolute;bottom:-120px;border-radius:50% 50% 50% 50%/55% 55% 45% 45%;opacity:.9;animation:floatUp linear infinite}
  .balloon::after{content:'';position:absolute;left:50%;bottom:-18px;width:2px;height:20px;background:rgba(255,255,255,.7)}
  @keyframes floatUp{to{transform:translateY(-120vh)}}
  .note{margin-top:14px;color:#fff;opacity:.8;font-size:.85rem}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div class="stage">
  <h1>HAPPY <span>BIRTHDAY!</span></h1>
  <div class="subtitle">from Jungkook 🐰💜</div>
  <div class="char-wrap">
  <svg viewBox="0 0 400 420" width="100%" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="hairGrad" x1="0" y1="0" x2="0.35" y2="1">
        <stop offset="0%" stop-color="#3a2f27"/>
        <stop offset="45%" stop-color="#241d19"/>
        <stop offset="100%" stop-color="#191411"/>
      </linearGradient>
      <radialGradient id="faceShade" cx="0.5" cy="0.35" r="0.75">
        <stop offset="0%" stop-color="#ffe4c9"/>
        <stop offset="100%" stop-color="#f7cda8"/>
      </radialGradient>
    </defs>

    <!-- shadow -->
    <ellipse cx="200" cy="400" rx="90" ry="14" fill="rgba(0,0,0,.25)"/>

    <!-- body: purple hoodie -->
    <rect x="135" y="270" width="130" height="110" rx="32" fill="#7b2cbf"/>
    <rect x="135" y="270" width="130" height="110" rx="32" fill="none" stroke="#5a189a" stroke-width="4"/>
    <path d="M170 275 Q200 295 230 275 L225 295 Q200 310 175 295 Z" fill="#e0c3fc"/>
    <text x="200" y="345" text-anchor="middle" font-size="22" font-weight="900" fill="white">JK 💜</text>

    <!-- arms -->
    <g class="arm-left">
      <rect x="85" y="270" width="60" height="28" rx="14" fill="#7b2cbf" stroke="#5a189a" stroke-width="3"/>
      <circle cx="90" cy="284" r="14" fill="#ffd9b3"/>
    </g>
    <g class="arm-right">
      <rect x="255" y="270" width="60" height="28" rx="14" fill="#7b2cbf" stroke="#5a189a" stroke-width="3"/>
      <circle cx="310" cy="284" r="14" fill="#ffd9b3"/>
    </g>

    <!-- head -->
    <circle cx="200" cy="175" r="95" fill="url(#faceShade)" stroke="#eab68c" stroke-width="3"/>

    <!-- ===== HAIR: first try classic ===== -->
    <path d="M105 165 Q105 70 200 65 Q295 70 295 165 Q285 130 270 125 Q275 150 265 155 Q260 120 235 110 Q220 135 190 130 Q160 125 150 150 Q135 145 133 165 Z" fill="#151515"/>
    <path d="M130 160 Q150 120 200 115 Q250 120 270 160 Q250 135 200 132 Q150 135 130 160" fill="#2a2a2a"/>

    <!-- ear + hoop earring peeking below hair -->
    <ellipse cx="112" cy="212" rx="9" ry="13" fill="#f7cda8" stroke="#eab68c" stroke-width="2"/>
    <circle cx="111" cy="228" r="7" fill="none" stroke="#ffe66d" stroke-width="3"/>

    <!-- eyes -->
    <g class="eye">
      <ellipse cx="165" cy="192" rx="14" ry="17" fill="white"/>
      <circle cx="166" cy="195" r="8" fill="#3a2317"/>
      <circle cx="169" cy="192" r="3" fill="white"/>
    </g>
    <g class="eye">
      <ellipse cx="235" cy="192" rx="14" ry="17" fill="white"/>
      <circle cx="234" cy="195" r="8" fill="#3a2317"/>
      <circle cx="237" cy="192" r="3" fill="white"/>
    </g>
    <!-- brows -->
    <path d="M150 170 Q165 164 180 170" stroke="#241d19" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <path d="M220 170 Q235 164 250 170" stroke="#241d19" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <!-- bunny smile -->
    <path d="M180 232 Q200 247 220 232 Q215 252 200 254 Q185 252 180 232" fill="#7a3b2e"/>
    <rect x="191" y="234" width="18" height="10" rx="3" fill="white"/>
    <!-- blush -->
    <ellipse cx="145" cy="217" rx="12" ry="7" fill="#ff9aa2" opacity=".7"/>
    <ellipse cx="255" cy="217" rx="12" ry="7" fill="#ff9aa2" opacity=".7"/>
    <!-- tattoo sleeve hint -->
    <path d="M275 290 Q285 320 280 350" stroke="#333" stroke-width="3" fill="none" opacity=".6"/>

    <!-- SIGN -->
    <g class="sign-group">
      <rect x="60" y="280" width="280" height="90" rx="16" fill="#fff8dc" stroke="#ff6b6b" stroke-width="6"/>
      <rect x="60" y="280" width="280" height="90" rx="16" fill="none" stroke="#ffe66d" stroke-width="2" stroke-dasharray="10 8"/>
      <text x="200" y="315" text-anchor="middle" font-size="26" font-weight="900" fill="#ff4d6d">HAPPY BIRTHDAY</text>
      <text x="200" y="343" text-anchor="middle" font-size="18" font-weight="700" fill="#7b2cbf">★ ARMY ★</text>
      <rect x="95" y="365" width="8" height="35" fill="#8d6a4f"/>
      <rect x="297" y="365" width="8" height="35" fill="#8d6a4f"/>
    </g>
  </svg>
  </div>
  <div class="note">stylized fan-art animation • made with code</div>
</div>

<script>
const c=document.getElementById('confetti'),x=c.getContext('2d');
let W,H;function rs(){W=c.width=innerWidth;H=c.height=innerHeight}rs();addEventListener('resize',rs);
const colors=['#ffe66d','#ff6b6b','#c8b6ff','#90be6d','#ffca3a','#f72585','#4cc9f0'];
let p=Array.from({length:150},()=>({x:Math.random()*innerWidth,y:Math.random()*-innerHeight,w:6+Math.random()*8,h:8+Math.random()*10,c:colors[Math.random()*colors.length|0],v:2+Math.random()*3,r:Math.random()*Math.PI,vr:-.1+Math.random()*.2}));
(function anim(){x.clearRect(0,0,W,H);p.forEach(o=>{x.save();x.translate(o.x,o.y);x.rotate(o.r);x.fillStyle=o.c;x.fillRect(-o.w/2,-o.h/2,o.w,o.h);x.restore();o.y+=o.v;o.r+=o.vr;if(o.y>H){o.y=-20;o.x=Math.random()*W}});requestAnimationFrame(anim)})();
for(let i=0;i<8;i++){let b=document.createElement('div');b.className='balloon';let s=40+Math.random()*40;b.style.width=s+'px';b.style.height=(s*1.2)+'px';b.style.left=Math.random()*100+'vw';b.style.background=colors[i%colors.length];b.style.animationDuration=(6+Math.random()*6)+'s';b.style.animationDelay=(Math.random()*6)+'s';document.body.appendChild(b);}
</script>
</body>
</html>
